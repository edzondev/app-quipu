packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  "@sentry/cli": true
  core-js: true
  esbuild: true
  unrs-resolver: true
trustLockfile: true
verifyDepsBeforeRun: false
overrides:
  # Pinned to the 1.6 line because @convex-dev/better-auth 0.12.5 only supports
  # >=1.6.11 <1.7.0, and 1.7 breaks the Convex bundle.
  # https://github.com/get-convex/better-auth/issues/433
  # Do not remove until a compatible version exists.
  better-auth: 1.6.33
  "@better-auth/passkey": 1.6.33
  "@better-auth/core": 1.6.33
  "@better-auth/expo": 1.6.33
  # SDK 58 / React 19.3: one @types/react across web+mobile. Dual 19.2+19.3
  # breaks ComponentProps<"div"> key (unique symbol vs Key).
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
