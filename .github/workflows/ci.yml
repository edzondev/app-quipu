name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 11+: this action installs pnpm and Node. Skip its install so CI
      # can pass --frozen-lockfile explicitly.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format + lint (Biome)
        run: pnpm ci:quality

      - name: Typecheck mobile and Convex
        run: pnpm typecheck:ci

      - name: Mobile unit tests (Jest)
        run: pnpm test:mobile

      - name: Web unit tests (Vitest)
        run: pnpm test:web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect mobile or workflow changes
        id: changes
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD | grep -Eq '^(apps/mobile/(modules/|android/|app\.json|app\.config|eas\.json|package\.json)|pnpm-lock\.yaml|\.github/workflows/)'
          if [ "$?" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/setup@v2
        if: steps.changes.outputs.run == 'true'
        with:
          runtime: node@24
          cache: true
          install: false

      - uses: actions/setup-java@v4
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Ensure Android SDK 36
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          SM=""
          while IFS= read -r candidate; do
            SM="$candidate"
            break
          done < <(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort)
          if [ -z "$SM" ]; then
            echo "sdkmanager was not found under $SDK/cmdline-tools" >&2
            exit 1
          fi
          echo "sdkmanager: $SM"
          # `yes` exits with SIGPIPE once sdkmanager closes stdin.
          set +o pipefail
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          set -o pipefail
          # Platform 36 and build-tools 36 are on the runner image. RN 0.86
          # pins NDK 27.1.12297006, which that image does not ship.
          "$SM" --sdk_root="$SDK" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Prebuild Android
        if: steps.changes.outputs.run == 'true'
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --clean -p android

      - name: Assemble debug and run listener unit tests
        if: steps.changes.outputs.run == 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug :quipu-notification-listener:testDebugUnitTest --stacktrace
