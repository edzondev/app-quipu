# Flujos ejecutables. subflows/ solo se llama con runFlow.
# Sin executionOrder: --include-tags=smoke no exige flujos que no tienen ese tag.
# Lo listado en flowsOrder corre primero; lo no listado, después, sin orden fijo
# (https://docs.maestro.dev/maestro-flows/workspace-management/sequential-execution).
# Listar solo z-ciclo-nuevo-antes-del-fin lo pondría primero. No hay opción
# documentada para entradas faltantes (https://github.com/mobile-dev-inc/Maestro/issues/1681).
# El prefijo z- lo deja último en el orden alfabético de la corrida (PR #118).
flows:
  - "flows/*"
excludeTags:
  - one-shot
  - wip
  - blocked
  - cuenta-nueva
