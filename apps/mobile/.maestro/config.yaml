# Flujos ejecutables. subflows/ solo se llama con runFlow.
# La corrida completa usa este orden. Smoke usa config.smoke.yaml
# (sin executionOrder: --include-tags=smoke no exige flujos fuera de ese tag;
# https://github.com/mobile-dev-inc/Maestro/issues/1681).
# Lo listado en flowsOrder corre primero, en orden
# (https://docs.maestro.dev/maestro-flows/workspace-management/sequential-execution).
# ciclo-nuevo-antes-del-fin y luego mismo-dia-solo-sumar van al final.
# El primero cierra si el ciclo no empezó hoy; si ya empezó hoy afirma
# nuevo ciclo oculto y que CICLO empieza hoy (Lima). El segundo exige
# startedToday (no cierra para armarse).
flows:
  - "flows/*"
excludeTags:
  - one-shot
  - wip
  - blocked
  - cuenta-nueva
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - ahorro-metas
    - ajustes-cerrar-sesion
    - compromisos
    - controles-escondidos
    - home-ciclo
    - movimientos-editar-eliminar
    - movimientos
    - plan-sobres
    - preview-sin-selector-dev
    - registrar-gasto-hoja
    - registrar-ingreso
    - sign-in
    - sumar-no-cierra
    - welcome
    - ciclo-nuevo-antes-del-fin
    - mismo-dia-solo-sumar
