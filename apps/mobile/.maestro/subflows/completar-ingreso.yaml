appId: com.quipu.finance
---
# Hoja de ingreso ya abierta. QUIPU_MODE_ID: income-mode-new-cycle o income-mode-add.
# Monto S/ 10.00. Si el perfil es de planilla, «Sumar» muestra los tipos; se elige Otro.
# La hoja scrollea: el envío puede quedar abajo.
- tapOn:
    id: ${QUIPU_MODE_ID}
- runFlow:
    when:
      visible:
        id: income-extra-types
    commands:
      - scrollUntilVisible:
          element:
            id: income-extra-custom
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: income-extra-custom
- tapOn:
    text: "1"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- assertVisible: "10\\.00"
- scrollUntilVisible:
    element:
      id: income-submit
    direction: DOWN
    timeout: 10000
- tapOn:
    id: income-submit
    enabled: true
- extendedWaitUntil:
    notVisible: "(?-i)"
    timeout: 20000
