appId: com.quipu.finance
---
# QUIPU_TIPO es el texto completo de la opción:
# "Empieza un nuevo ciclo" o "Sumar al ciclo actual".
# En b70a12f la hoja usa esos textos (sin ¿) y los testID income-mode-new-cycle / income-mode-add.
# Monto S/ 10.00. Inicio con ciclo, «+ Ingreso» a la vista.
# (?-i) separa el título «REGISTRAR INGRESO» del botón «Registrar ingreso».
- tapOn:
    text: "\\+ Ingreso"
- extendedWaitUntil:
    visible: "(?-i)REGISTRAR INGRESO"
    timeout: 10000
- tapOn:
    text: ${QUIPU_TIPO}
    below: "(?-i)REGISTRAR INGRESO"
- tapOn:
    text: "1"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- assertVisible: "10\\.00"
- tapOn:
    text: "(?-i)Registrar ingreso"
    enabled: true
- extendedWaitUntil:
    notVisible: "(?-i)REGISTRAR INGRESO"
    timeout: 20000
