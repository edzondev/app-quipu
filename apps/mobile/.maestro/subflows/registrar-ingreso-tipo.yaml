appId: com.quipu.finance
---
# QUIPU_TIPO es el texto completo de la opción, como regex:
# "¿Empieza un nuevo ciclo\\?" o "Sumar al ciclo actual".
# Monto S/ 10.00. Inicio con ciclo, «+ Ingreso» a la vista.
# Espera arreglo pendiente (Pixi): en e54ad3d la hoja no pregunta.
# Todo ingreso se manda como habitual y cierra el ciclo.
- tapOn:
    text: "\\+ Ingreso"
- extendedWaitUntil:
    visible: "REGISTRAR INGRESO"
    timeout: 10000
- tapOn:
    text: ${QUIPU_TIPO}
    below: "REGISTRAR INGRESO"
- tapOn:
    text: "^1$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- assertVisible: "10\\.00"
- tapOn: "Registrar ingreso"
- extendedWaitUntil:
    notVisible: "REGISTRAR INGRESO"
    timeout: 20000
