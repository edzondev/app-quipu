appId: com.quipu.finance
---
- runFlow: abrir-formulario-correo.yaml
# El texto coincide con la etiqueta y con el accessibilityLabel del campo,
# y Maestro no distingue mayúsculas. index: 1 apunta al input, no a la etiqueta.
# Confirmar con maestro hierarchy.
- tapOn:
    text: "Correo"
    index: 1
- inputText: ${QUIPU_EMAIL}
- tapOn:
    text: "Contraseña"
    index: 1
- inputText: ${QUIPU_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Entrar"
    enabled: true
