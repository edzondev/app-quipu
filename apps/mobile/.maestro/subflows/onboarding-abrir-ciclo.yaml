appId: com.quipu.finance
---
# Cuenta fresca ya en el paso 1. «Después», ciclo abierto, número igual en Inicio.
# La flecha del asistente (wizard-back) no es el atrás de Android: ese caso es manual.
- runFlow: onboarding-hasta-paso-4.yaml
- tapOn:
    id: commitments-skip
- extendedWaitUntil:
    visible: "Puedes gastar hoy"
    timeout: 10000
- assertVisible: "TU SISTEMA · 05/05"
- runFlow: assert-paso5-960.yaml
- tapOn: "Empezar mi ciclo"
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 40000
- assertVisible: "960"
- assertVisible: ${output.stepDaily}
# Espera arreglo pendiente (Pixi): el primer ciclo no muestra arrastre.
- assertNotVisible: "Saldo que quedó"
