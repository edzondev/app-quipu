appId: com.quipu.finance
---
# Inicio tiene una sección que también dice «Movimientos» (home-dense.tsx).
# Tocar ese texto no abre la pestaña: Maestro scrollea hasta la sección y el
# gasto nuevo ya está ahí, así que «CICLO …» (solo en movements-list.tsx) no aparece.
# «Ver todos» sí abre /(tabs)/movements (app/(tabs)/index.tsx).
- tapOn: "Ver todos"
- extendedWaitUntil:
    visible: "CICLO .*"
    timeout: 15000
