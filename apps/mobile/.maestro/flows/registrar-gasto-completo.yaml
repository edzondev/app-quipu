appId: com.quipu.finance
tags:
  - p0
  - registrar
---
# Notion 3f486a7356a68159a778eda5c427c41f
# Registrar gasto en pantalla completa
# 1.234 se rechaza: 3f486a7356a681e78f2be50f8f7e3a16
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- evalScript: "${output.merchant = 'Mercado' + Date.now()}"
- tapOn:
    text: "^Registrar$"
- extendedWaitUntil:
    visible: "NUEVO GASTO"
    timeout: 10000
- tapOn:
    text: "^1$"
- tapOn:
    text: "^5$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^Comercio$"
- inputText: ${output.merchant}
- hideKeyboard
- tapOn:
    text: "^Gustos$"
    below: "NUEVO GASTO"
- tapOn: "Abrir detalle del gasto"
- extendedWaitUntil:
    visible: "REGISTRAR GASTO"
    timeout: 10000
- assertVisible: ${output.merchant}
- assertVisible: "HOY QUEDARÍA.*"
- assertNotVisible:
    text: "^Nota$"
- assertNotVisible: "Adjuntar boleta"
- tapOn: "Monto"
- eraseText
- inputText: "1.234"
- hideKeyboard
- tapOn: "Registrar gasto"
- extendedWaitUntil:
    visible: "Ingresa un monto mayor a cero."
    timeout: 5000
- tapOn: "Monto"
- eraseText
- inputText: "15.50"
- hideKeyboard
- tapOn: "Registrar gasto"
- extendedWaitUntil:
    notVisible: "REGISTRAR GASTO"
    timeout: 20000
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: ${output.merchant}
    timeout: 15000
- assertVisible: ".*15\\.50"
