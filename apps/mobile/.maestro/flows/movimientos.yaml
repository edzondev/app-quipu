appId: com.quipu.finance
tags:
  - smoke
  - p1
  - movimientos
---
# Notion 3f486a7356a681c697bad1f751335490
# Movimientos: lista por día, filtros y búsqueda. El filtro «Ahorro» se ve.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- evalScript: "${output.merchant = 'Bodega' + Date.now()}"
- tapOn:
    text: "Registrar"
- extendedWaitUntil:
    visible: "NUEVO GASTO"
    timeout: 10000
- tapOn:
    text: "2"
- tapOn:
    text: "5"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- tapOn:
    text: "Comercio"
- inputText: ${output.merchant}
- hideKeyboard
- tapOn:
    text: "Necesidades"
    below: "NUEVO GASTO"
- tapOn: "Registrar gasto"
- extendedWaitUntil:
    notVisible: "NUEVO GASTO"
    timeout: 20000
- tapOn:
    text: "Movimientos"
- extendedWaitUntil:
    visible: ${output.merchant}
    timeout: 15000
- assertVisible: "CICLO .*"
- assertVisible: "HOY · .*"
- assertVisible: "Todos"
- assertVisible: "Necesidades"
- assertVisible: "Gustos"
- assertVisible: "Ahorro"
- tapOn:
    text: "Gustos"
- extendedWaitUntil:
    notVisible: ${output.merchant}
    timeout: 5000
- tapOn:
    text: "Necesidades"
- assertVisible: ${output.merchant}
- tapOn:
    text: "Ahorro"
- assertNotVisible: ${output.merchant}
- tapOn:
    text: "Todos"
- assertVisible: ${output.merchant}
- tapOn: "Buscar"
- assertVisible: "Buscar movimientos"
- tapOn: "Buscar movimientos"
- inputText: "zzz-no-existe"
- assertVisible: "Ningún movimiento con ese criterio."
- eraseText
- inputText: "bod"
- assertVisible: ${output.merchant}
- assertNotVisible: "Ningún movimiento con ese criterio."
- tapOn: "Buscar"
- extendedWaitUntil:
    notVisible: "Buscar movimientos"
    timeout: 5000
- assertVisible: ${output.merchant}
