appId: com.quipu.finance
tags:
  - p0
  - onboarding
  - one-shot
---
# Notion 3f486a7356a6811e875cd4a55d3340cd reparto (en el código es el paso 3)
# Notion 3f486a7356a681c78c1be4c0e607cad5 compromisos completos
# Notion 3f486a7356a68125aec2f56e21bd1d92 resumen
# Notion 3f486a7356a681f4a6e6d2b0add684ee solo la fecha de mañana, sin calendario
# Gasta la cuenta QUIPU_E2E_FRESH_*: el servidor no abre un segundo primer ciclo.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_FRESH_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_FRESH_PASSWORD}
- extendedWaitUntil:
    visible: "¿Cómo entra tu dinero?"
    timeout: 30000
- runFlow: ../subflows/onboarding-hasta-paso-4.yaml
- tapOn:
    id: wizard-back
- assertVisible: "¿Cómo repartes tu ingreso?"
- tapOn: "Continuar"
- extendedWaitUntil:
    visible: "¿Qué pagas todos los meses?"
    timeout: 10000
- tapOn:
    id: chip-agua
- tapOn:
    id: commitment-amount-0
- inputText: "100"
- tapOn:
    id: commitment-day-0
- inputText: "10"
- hideKeyboard
- assertVisible:
    id: commitments-total
- tapOn: "Continuar"
- extendedWaitUntil:
    visible: "Puedes gastar hoy"
    timeout: 10000
- assertVisible: "TU SISTEMA · 05/05"
- assertVisible:
    id: confirm-daily
- assertVisible: "S/ 28\\.66"
- assertVisible: "Después de compromisos y ahorro, en 30 días."
- assertVisible:
    id: confirm-income
- assertVisible: "Próximo cobro"
- assertVisible:
    id: confirm-pay-date
- assertVisible: "50% · S/ 600"
- assertVisible: "30% · S/ 360"
- assertVisible: "20% · S/ 240"
- assertVisible:
    id: confirm-envelope-needs
- assertVisible:
    id: confirm-envelope-wants
- assertVisible:
    id: confirm-envelope-savings
- assertVisible:
    id: confirm-commitments
- tapOn: "Empezar mi ciclo"
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 40000
- assertVisible: "Inicio"
- assertVisible: "Agua"
- assertVisible: "Necesidades"
- assertVisible: "Gustos"
- assertVisible: "Ahorro"
