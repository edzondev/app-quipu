appId: com.quipu.finance
tags:
  - p0
  - home
  - no-cycle
  - one-shot
  - cuenta-nueva
---
# Notion 3f486a7356a681a4a21fee156fe6858f
# Registra el primer ingreso y deja la cuenta CON ciclo. Una sola corrida.
# No se afirman S/ 1,500 ni «Día 1/15»: el largo del ciclo y el fallo M18
# («Día 0») no son estables para Maestro.
# Sin ciclo solo aparece «Empieza un nuevo ciclo».
# Nunca tuvo ciclo: registra el primero y la deja con ciclo. Apunta QUIPU_E2E_EMAIL ahí.
# No corre por defecto (one-shot y cuenta-nueva).
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Aún no hay ciclo"
    timeout: 30000
- tapOn: "Registrar ingreso"
- extendedWaitUntil:
    visible: "(?-i)REGISTRAR INGRESO"
    timeout: 10000
- assertVisible:
    id: income-mode-new-cycle
- assertNotVisible:
    id: income-mode-add
- tapOn:
    text: "3"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- assertVisible: "3000\\.00"
- scrollUntilVisible:
    element:
      id: income-submit
    direction: DOWN
    timeout: 10000
- tapOn:
    id: income-submit
    enabled: true
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- assertNotVisible: "Aún no hay ciclo"
- assertVisible: "Necesid\\."
- assertVisible: "Gustos"
- assertVisible: "Ahorro"
# Misma línea de Inicio que home-ciclo: «Sobra» o «Te pasaste por» si el saldo quedó negativo.
- assertVisible: "(.*Sobra .*|.*Te pasaste por .*)"
- tapOn:
    text: "Movimientos"
- extendedWaitUntil:
    visible: "CICLO .*"
    timeout: 15000
- assertVisible: "\\+ S/ 3,000"
- tapOn:
    text: "Plan"
- tapOn:
    text: "Sobres"
- extendedWaitUntil:
    visible: "Necesidades"
    timeout: 15000
- assertVisible: "Gustos"
- assertVisible: "Ahorro"
