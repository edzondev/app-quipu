appId: com.quipu.finance
tags:
  - p0
  - home
  - no-cycle
  - one-shot
---
# Notion 3f486a7356a681a4a21fee156fe6858f
# Registra el primer ingreso y deja la cuenta CON ciclo. Una sola corrida.
# No se afirman S/ 1,500 ni «Día 1/15»: el largo del ciclo y el fallo M18
# («Día 0») no son estables para Maestro.
# Sin ciclo solo aparece «Empieza un nuevo ciclo».
# Cuenta propia por corrida. No uses QUIPU_E2E_NO_CYCLE_*: este flujo deja la cuenta con ciclo.
# La fila de Movimientos no cambia: el monto es «+ S/ 3,000». El concepto sigue siendo «Sueldo».
# Semilla pendiente (Nato): QUIPU_E2E_FIRST_INCOME_*.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_FIRST_INCOME_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_FIRST_INCOME_PASSWORD}
- extendedWaitUntil:
    visible: "Aún no hay ciclo"
    timeout: 30000
- tapOn: "Registrar ingreso"
- extendedWaitUntil:
    visible: "(?-i)REGISTRAR INGRESO"
    timeout: 10000
- assertVisible:
    text: "Empieza un nuevo ciclo"
    below: "(?-i)REGISTRAR INGRESO"
- assertNotVisible: "Sumar al ciclo actual"
- tapOn:
    text: "3"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- assertVisible: "3000\\.00"
- tapOn:
    text: "(?-i)Registrar ingreso"
    enabled: true
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- assertNotVisible: "Aún no hay ciclo"
- assertVisible: "Necesid\\."
- assertVisible: "Gustos"
- assertVisible: "Ahorro"
- assertVisible: ".*Sobra .*"
- tapOn:
    text: "Movimientos"
- extendedWaitUntil:
    visible: "CICLO .*"
    timeout: 15000
- assertVisible: "\\+ S/ 3,000"
- tapOn:
    text: "Plan"
- tapOn:
    text: "Sobres"
- extendedWaitUntil:
    visible: "Necesidades"
    timeout: 15000
- assertVisible: "Gustos"
- assertVisible: "Ahorro"
