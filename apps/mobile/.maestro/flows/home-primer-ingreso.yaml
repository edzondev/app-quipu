appId: com.quipu.finance
tags:
  - p0
  - home
  - no-cycle
  - one-shot
---
# Notion 3f486a7356a681a4a21fee156fe6858f
# Registra el primer ingreso y deja la cuenta CON ciclo. Una sola corrida.
# No se afirman S/ 1,500 ni «Día 1/15»: el largo del ciclo y el fallo M18
# («Día 0») no son estables para Maestro.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_NO_CYCLE_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_NO_CYCLE_PASSWORD}
- extendedWaitUntil:
    visible: "Aún no hay ciclo"
    timeout: 30000
- tapOn: "Registrar ingreso"
- extendedWaitUntil:
    visible: "REGISTRAR INGRESO"
    timeout: 10000
- assertVisible:
    text: "^Sueldo$"
    below: "REGISTRAR INGRESO"
- assertVisible: "Tu sueldo empieza un ciclo nuevo"
- assertNotVisible:
    text: "^Extra$"
- tapOn:
    text: "^3$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- assertVisible: "3000\\.00"
- tapOn: "Registrar ingreso"
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- assertNotVisible: "Aún no hay ciclo"
- assertVisible: "Necesidades"
- assertVisible: "Gustos"
- assertVisible: "Ahorro"
- assertVisible: "Sobra"
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: "Sueldo"
    timeout: 15000
- tapOn:
    text: "^Plan$"
- tapOn:
    text: "^Sobres$"
- extendedWaitUntil:
    visible: "Necesidades"
    timeout: 15000
- assertVisible: "Gustos"
- assertVisible: "Ahorro"
