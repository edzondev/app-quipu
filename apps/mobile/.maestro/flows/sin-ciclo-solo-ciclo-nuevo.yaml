appId: com.quipu.finance
tags:
  - p0
  - registrar
  - no-cycle
  - cuenta-nueva
---
# Antes: sin-ciclo-solo-sueldo.
# Notion 3f486a7356a681daadc6eba893faea43
# Sin ningún ciclo solo está «Empieza un nuevo ciclo». «Sumar al ciclo actual» no está.
# No guarda, así que la cuenta sigue sin ciclo.
#
# Perfil sin ningún ciclo. Apunta QUIPU_E2E_EMAIL a esa cuenta. No corre por defecto.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Aún no hay ciclo"
    timeout: 30000
- tapOn: "Registrar ingreso"
- extendedWaitUntil:
    visible: "(?-i)REGISTRAR INGRESO"
    timeout: 10000
- assertVisible:
    id: income-mode-new-cycle
- assertNotVisible:
    id: income-mode-add
- tapOn: "Cancelar"
- extendedWaitUntil:
    visible: "Aún no hay ciclo"
    timeout: 10000
