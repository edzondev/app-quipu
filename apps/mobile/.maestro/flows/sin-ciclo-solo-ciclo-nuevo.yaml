appId: com.quipu.finance
tags:
  - p0
  - registrar
  - no-cycle
---
# Antes: sin-ciclo-solo-sueldo.
# Notion 3f486a7356a681daadc6eba893faea43
# Sin ningún ciclo solo se puede empezar uno. «Sumar al ciclo actual» no está.
# El texto de ayuda, si lo hay, está por confirmar con Pixi.
# No guarda, así que la cuenta sigue sin ciclo.
# Espera arreglo pendiente (Pixi): la hoja todavía no pregunta.
#
# devSeed:seedVerifiedAccount (PR #107) crea una cuenta sin perfil y cae
# en el asistente. Esta cuenta tiene que tener perfil y ningún ciclo:
# QUIPU_E2E_NO_CYCLE_*. El seed todavía no arma ese estado.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_NO_CYCLE_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_NO_CYCLE_PASSWORD}
- extendedWaitUntil:
    visible: "Aún no hay ciclo"
    timeout: 30000
- tapOn: "Registrar ingreso"
- extendedWaitUntil:
    visible: "REGISTRAR INGRESO"
    timeout: 10000
- assertVisible:
    text: "¿Empieza un nuevo ciclo\\?"
    below: "REGISTRAR INGRESO"
- assertNotVisible: "Sumar al ciclo actual"
- tapOn: "Cancelar"
- extendedWaitUntil:
    visible: "Aún no hay ciclo"
    timeout: 10000
