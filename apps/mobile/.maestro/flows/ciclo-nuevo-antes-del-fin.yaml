appId: com.quipu.finance
tags:
  - p0
  - registrar
---
# Antes: sueldo-antes-del-fin.
# Notion 3f486a7356a681b0b79ffe78ff0896aa
# «¿Empieza un nuevo ciclo?» cierra el ciclo en cualquier fecha (#105).
# El ciclo tiene que haber empezado antes de hoy y quedar a varios días del fin.
# No sirve la cuenta fija ni una semilla de hoy: depende de una semilla futura,
# una cuenta nueva por corrida (QUIPU_E2E_PRIOR_CYCLE_*). No uses una cuenta personal.
# Espera arreglo pendiente (Pixi): la hoja todavía no pregunta.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_PRIOR_CYCLE_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PRIOR_CYCLE_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: "CICLO .*"
    timeout: 15000
- copyTextFrom:
    text: "CICLO .*"
- evalScript: "${output.cycleBefore = maestro.copiedText.split(' · ')[0]}"
- tapOn:
    text: "^Inicio$"
- runFlow:
    file: ../subflows/registrar-ingreso-tipo.yaml
    env:
      QUIPU_TIPO: "¿Empieza un nuevo ciclo\\?"
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: ".*10\\.00"
    timeout: 20000
- assertNotVisible: "${output.cycleBefore} · .*"
- assertVisible: "CICLO .*"
- tapOn:
    text: "^Inicio$"
- assertVisible: "Hoy puedes gastar"
- assertVisible: "Saldo que quedó.*"
