appId: com.quipu.finance
tags:
  - p0
  - movimientos
---
# Notion 3f486a7356a6817da15fc9624b8f5134 editar
# Notion 3f486a7356a6811581f8dc9ea7012f2a eliminar (un toque; el doble toque es manual)
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- evalScript: "${output.merchant = 'Taller' + Date.now()}"
- tapOn:
    text: "^Registrar$"
- extendedWaitUntil:
    visible: "NUEVO GASTO"
    timeout: 10000
- tapOn:
    text: "^2$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^Comercio$"
- inputText: ${output.merchant}
- hideKeyboard
- tapOn:
    text: "^Gustos$"
    below: "NUEVO GASTO"
- tapOn: "Registrar gasto"
- extendedWaitUntil:
    notVisible: "NUEVO GASTO"
    timeout: 20000
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: ${output.merchant}
    timeout: 15000
- tapOn: ${output.merchant}
- extendedWaitUntil:
    visible: "EDITAR GASTO"
    timeout: 10000
- assertVisible: "HOY QUEDARÍA.*"
- tapOn: "Monto"
- eraseText
- inputText: "30"
- hideKeyboard
- tapOn: "Guardar"
- extendedWaitUntil:
    notVisible: "EDITAR GASTO"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*30\\.00"
    timeout: 15000
- tapOn: ${output.merchant}
- extendedWaitUntil:
    visible: "Eliminar"
    timeout: 10000
- tapOn: "Eliminar"
- extendedWaitUntil:
    visible: "Eliminar gasto"
    timeout: 5000
- assertVisible: "El monto vuelve al sobre."
- tapOn:
    text: "^Cancelar$"
    below: "El monto vuelve al sobre."
- assertNotVisible: "El monto vuelve al sobre."
- assertVisible: "EDITAR GASTO"
- tapOn: "Eliminar"
- extendedWaitUntil:
    visible: "El monto vuelve al sobre."
    timeout: 5000
- tapOn:
    text: "^Eliminar$"
    below: "El monto vuelve al sobre."
- extendedWaitUntil:
    notVisible: "EDITAR GASTO"
    timeout: 20000
- assertNotVisible: ${output.merchant}
