appId: com.quipu.finance
tags:
  - p1
  - onboarding
  - cuenta-nueva
---
# Notion 3f486a7356a681c78c1be4c0e607cad5
# «Después» no guarda compromisos.
# Hace falta una cuenta sin perfil. Apunta QUIPU_E2E_EMAIL a esa cuenta. No corre por defecto.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "¿Cómo entra tu dinero?"
    timeout: 30000
- runFlow: ../subflows/onboarding-abrir-ciclo.yaml
- tapOn:
    text: "Plan"
- tapOn: "Compromisos"
- extendedWaitUntil:
    visible: "SIN COMPROMISOS"
    timeout: 15000
- assertVisible: "Aún no registras tus pagos fijos."
- assertVisible: "Agregar compromiso"
- assertVisible: "RESERVADO ESTE CICLO"
