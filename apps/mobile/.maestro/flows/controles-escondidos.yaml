appId: com.quipu.finance
tags:
  - p1
  - hidden
---
# H4–H8. Selección por texto visible.
# H2 Nota y H3 Adjuntar boleta estaban en la pantalla que abría la cámara (#123).
# H4 Perfil y datos        settings/settings-screen.tsx
# H5 Plan y suscripción    settings/settings-screen.tsx
# H6 Reparto               settings/settings-screen.tsx
# H7 Ciclo e ingresos      settings/settings-screen.tsx
# H8 Reparto del ciclo     plan/plan-hub.tsx
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- tapOn:
    text: "Plan"
- extendedWaitUntil:
    visible: "Ahorro"
    timeout: 10000
- assertNotVisible: "Reparto del ciclo"
- tapOn:
    text: "Sobres"
- extendedWaitUntil:
    visible: "Sobres"
    timeout: 15000
- tapOn: "Volver"
- tapOn:
    text: "Inicio"
- tapOn:
    text: "Registrar"
- extendedWaitUntil:
    visible:
      id: expense-sheet
    timeout: 10000
- tapOn: "Cancelar"
- extendedWaitUntil:
    notVisible:
      id: expense-sheet
    timeout: 10000
- tapOn: "Ajustes"
- extendedWaitUntil:
    visible: "Cerrar sesión"
    timeout: 10000
- assertNotVisible: "Perfil y datos"
- assertNotVisible: "Plan y suscripción"
- assertNotVisible:
    text: "Reparto"
- assertNotVisible: "Ciclo e ingresos"
- tapOn:
    text: "Cerrar"
