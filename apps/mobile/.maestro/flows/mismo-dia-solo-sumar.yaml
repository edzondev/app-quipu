appId: com.quipu.finance
tags:
  - p0
  - registrar
  - onboarding
---
# Antes: sueldo-cierra-ciclo. El mismo día el ciclo no se puede cerrar.
# Notion 3f486a7356a681239318fa33957072e0
# El asistente abre el ciclo hoy. Solo «Sumar al ciclo actual».
# El cierre con arrastre está en ciclo-nuevo-antes-del-fin.
# Espera arreglo pendiente: rama de Pixi feature/mobile-income-cycle-choice y Nubo, PR #109.
# Corre el pre-paso antes: cuenta nueva en QUIPU_E2E_FRESH_*.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_FRESH_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_FRESH_PASSWORD}
- extendedWaitUntil:
    visible: "¿Cómo entra tu dinero?"
    timeout: 30000
- runFlow: ../subflows/onboarding-abrir-ciclo.yaml
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: "CICLO .*"
    timeout: 15000
- copyTextFrom:
    text: "CICLO .*"
- evalScript: "${output.cycleBefore = maestro.copiedText.split(' · ')[0]}"
- tapOn:
    text: "^Inicio$"
- tapOn:
    text: "\\+ Ingreso"
- extendedWaitUntil:
    visible: "REGISTRAR INGRESO"
    timeout: 10000
- assertVisible: "Sumar al ciclo actual"
- assertNotVisible: "¿Empieza un nuevo ciclo\\?"
- tapOn:
    text: "Sumar al ciclo actual"
    below: "REGISTRAR INGRESO"
- tapOn:
    text: "^1$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- assertVisible: "10\\.00"
- tapOn: "Registrar ingreso"
- extendedWaitUntil:
    notVisible: "REGISTRAR INGRESO"
    timeout: 20000
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: "${output.cycleBefore} · .*"
    timeout: 20000
- tapOn:
    text: "^Inicio$"
- assertNotVisible: "Saldo que quedó.*"
