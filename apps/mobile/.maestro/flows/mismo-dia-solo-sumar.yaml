appId: com.quipu.finance
tags:
  - p0
  - registrar
---
# Notion 3f486a7356a681239318fa33957072e0
# Antes: sueldo-cierra-ciclo. El mismo día de Lima el ciclo no se cierra.
# Misma cuenta que el resto (QUIPU_E2E_EMAIL / QUIPU_E2E_PASSWORD). Sin onboarding.
# Exige un ciclo que ya empezó hoy: «Empieza un nuevo ciclo» no está. Si está,
# este flujo falla (no cierra para armarse). En la corrida, ciclo-nuevo-antes-del-fin
# va antes y puede dejar ese estado.
# Sumar no cambia el rango de CICLO. «Saldo que quedó»: misma cantidad en Inicio
# antes y después del add (0 o 1); si el add cierra, el recuento cambia y falla.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- runFlow: ../subflows/abrir-movimientos.yaml
- copyTextFrom:
    text: "CICLO .*"
- evalScript: "${output.cycleBefore = maestro.copiedText.split(' · ')[0]}"
- tapOn:
    text: "Inicio"
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 15000
- evalScript: "${output.carryBefore = 0}"
- runFlow:
    when:
      visible: "Saldo que quedó.*"
    commands:
      - evalScript: "${output.carryBefore = 1}"
- tapOn:
    text: "Registrar"
- tapOn:
    text: "Ingreso"
- extendedWaitUntil:
    visible: "(?-i)REGISTRAR INGRESO"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: income-mode-add
    timeout: 10000
- assertNotVisible:
    id: income-mode-new-cycle
- assertVisible:
    id: income-mode-add
    selected: true
- runFlow:
    file: ../subflows/completar-ingreso.yaml
    env:
      QUIPU_MODE_ID: income-mode-add
- runFlow: ../subflows/abrir-movimientos.yaml
- extendedWaitUntil:
    visible: "${output.cycleBefore} · .*"
    timeout: 20000
- extendedWaitUntil:
    visible: "\\+ S/ 10"
    timeout: 15000
- tapOn:
    text: "Inicio"
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 15000
- evalScript: "${output.carryAfter = 0}"
- runFlow:
    when:
      visible: "Saldo que quedó.*"
    commands:
      - evalScript: "${output.carryAfter = 1}"
- assertTrue: "${output.carryBefore == output.carryAfter}"
