appId: com.quipu.finance
tags:
  - p0
  - progreso
  - blocked
---
# Notion 3f486a7356a6817698dbdf13ffd7bd83
# Notion 3f486a7356a6819d80b8f1b507a473e6
# Bloqueado. Hace falta una cuenta cuyo ciclo de apertura empezó antes de hoy.
# Ninguna semilla lo dice todavía: QUIPU_E2E_OPENING_PRIOR_* (Nato).
# No uses la cuenta fija ni una semilla de hoy: ese día no se puede cerrar.
# El cierre entra en el historial de Progreso. No cuenta en «CICLOS CERRADOS EN VERDE» ni en la racha.
# La racha cuenta 24 horas reales entre el inicio y el cierre, y nunca el ciclo de apertura.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_OPENING_PRIOR_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_OPENING_PRIOR_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- runFlow:
    file: ../subflows/registrar-ingreso-tipo.yaml
    env:
      QUIPU_TIPO: "Empieza un nuevo ciclo"
- tapOn:
    text: "Progreso"
- extendedWaitUntil:
    visible: "CICLOS CERRADOS EN VERDE"
    timeout: 20000
- assertVisible: "CICLO CERRADO · .*"
- assertVisible:
    text: "0"
    below: "CICLOS CERRADOS EN VERDE"
- assertNotVisible: "Aún no cierras un ciclo."
