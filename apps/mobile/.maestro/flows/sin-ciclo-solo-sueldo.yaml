appId: com.quipu.finance
tags:
  - p0
  - registrar
  - no-cycle
---
# sin caso aún
# Sin ciclo activo la hoja solo ofrece Sueldo. Extra no se ofrece.
# No guarda: la cuenta sigue sin ciclo y el flujo se puede repetir.
# El texto del error si un Extra llega al servidor sigue por confirmar con Nubo:
# este flujo no lo afirma.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_NO_CYCLE_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_NO_CYCLE_PASSWORD}
- extendedWaitUntil:
    visible: "Aún no hay ciclo"
    timeout: 30000
- tapOn: "Registrar ingreso"
- extendedWaitUntil:
    visible: "REGISTRAR INGRESO"
    timeout: 10000
- assertVisible:
    text: "^Sueldo$"
    below: "REGISTRAR INGRESO"
- assertNotVisible:
    text: "^Extra$"
- tapOn: "Cancelar"
- extendedWaitUntil:
    visible: "Aún no hay ciclo"
    timeout: 10000
