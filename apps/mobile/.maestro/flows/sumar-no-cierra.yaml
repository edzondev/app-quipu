appId: com.quipu.finance
tags:
  - p0
  - registrar
---
# «Sumar al ciclo actual» entra al ciclo abierto y no lo cierra.
# Misma cuenta que el resto (QUIPU_E2E_EMAIL). El rango de CICLO no cambia.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- tapOn:
    text: "Movimientos"
- extendedWaitUntil:
    visible: "CICLO .*"
    timeout: 15000
- copyTextFrom:
    text: "CICLO .*"
- evalScript: "${output.cycleBefore = maestro.copiedText.split(' · ')[0]}"
- tapOn:
    text: "Inicio"
- runFlow:
    file: ../subflows/registrar-ingreso-tipo.yaml
    env:
      QUIPU_MODE_ID: income-mode-add
- tapOn:
    text: "Movimientos"
- extendedWaitUntil:
    visible: "${output.cycleBefore} · .*"
    timeout: 20000
- assertVisible: ".*10\\.00"
- tapOn:
    text: "Inicio"
- assertVisible: "Hoy puedes gastar"
