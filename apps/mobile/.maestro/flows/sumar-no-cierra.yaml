appId: com.quipu.finance
tags:
  - p0
  - registrar
  - onboarding
---
# Antes: extra-no-cierra.
# Notion 3f486a7356a681a482f5ee2d8b6e2702
# «Sumar al ciclo actual» entra al ciclo y no lo cierra.
# Cuenta nueva por corrida (pre-paso + asistente). El ciclo empieza hoy,
# así que no hace falta uno de un día anterior.
# El ciclo vencido queda para la semilla planeada de Nato. No hay flujo.
# Espera arreglo pendiente (Pixi): en f98b65b la hoja dice «Sueldo» / «Extra». Los textos nuevos esperan feature/mobile-income-cycle-choice.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_FRESH_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_FRESH_PASSWORD}
- extendedWaitUntil:
    visible: "¿Cómo entra tu dinero?"
    timeout: 30000
- runFlow: ../subflows/onboarding-abrir-ciclo.yaml
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: "CICLO .*"
    timeout: 15000
- copyTextFrom:
    text: "CICLO .*"
- evalScript: "${output.cycleBefore = maestro.copiedText.split(' · ')[0]}"
- tapOn:
    text: "^Inicio$"
- runFlow:
    file: ../subflows/registrar-ingreso-tipo.yaml
    env:
      QUIPU_TIPO: "Sumar al ciclo actual"
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: "${output.cycleBefore} · .*"
    timeout: 20000
- assertVisible: ".*10\\.00"
- tapOn:
    text: "^Inicio$"
- assertVisible: "Hoy puedes gastar"
