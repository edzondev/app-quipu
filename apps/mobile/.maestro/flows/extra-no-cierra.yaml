appId: com.quipu.finance
tags:
  - p0
  - registrar
---
# sin caso aún
# Con ciclo activo, Extra se suma y no cambia las fechas del ciclo.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: "CICLO "
    timeout: 15000
- copyTextFrom:
    text: "CICLO .*"
- evalScript: "${output.cycleBefore = maestro.copiedText}"
- tapOn:
    text: "^Inicio$"
- runFlow:
    file: ../subflows/registrar-ingreso-tipo.yaml
    env:
      QUIPU_TIPO: Extra
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: ${output.cycleBefore}
    timeout: 20000
- assertVisible: "10\\.00"
- tapOn:
    text: "^Inicio$"
- assertVisible: "Hoy puedes gastar"
