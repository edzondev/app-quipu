appId: com.quipu.finance
tags:
  - p2
  - progreso
  - onboarding
---
# Notion 3f486a7356a681278c46c8b9151e0828
# Progreso vacío. Cuenta nueva por corrida: el ciclo de apertura sigue abierto
# y todavía no entra al historial. No uses la cuenta fija: otro flujo puede
# cerrarle un ciclo y esta pantalla deja de estar vacía.
# «Cierre vacío» (Aún no hay un cierre. / Volver a Progreso) no tiene
# un control en Progreso vacío: la ruta savings/cierre no se abre desde la UI.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_FRESH_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_FRESH_PASSWORD}
- extendedWaitUntil:
    visible: "¿Cómo entra tu dinero?"
    timeout: 30000
- runFlow: ../subflows/onboarding-abrir-ciclo.yaml
- tapOn:
    text: "Progreso"
- extendedWaitUntil:
    visible: "Aún no cierras un ciclo."
    timeout: 15000
- assertVisible: "La constancia aparece cuando el primero queda cerrado. Sin medallas ni apuro."
- tapOn: "Ir a Plan"
- extendedWaitUntil:
    visible: "Dónde está tu dinero antes de que lo gastes."
    timeout: 10000
- assertVisible:
    text: "Plan"
