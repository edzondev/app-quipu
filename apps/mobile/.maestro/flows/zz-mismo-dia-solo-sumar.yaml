appId: com.quipu.finance
tags:
  - p0
  - registrar
---
# Notion 3f486a7356a681239318fa33957072e0
# Antes: sueldo-cierra-ciclo. El mismo día de Lima el ciclo no se cierra.
# Misma cuenta que el resto (QUIPU_E2E_EMAIL / QUIPU_E2E_PASSWORD). Sin onboarding.
# El prefijo zz- lo corre después de z-ciclo-nuevo-antes-del-fin, que deja un
# ciclo empezado hoy (día de Lima). No hace falta preparar ese ciclo a mano.
# Las dos opciones se ven. «Sumar al ciclo actual» viene marcada. Tocar
# «Empieza un nuevo ciclo» igual solo suma: el rango de CICLO no cambia.
# No aparece «Saldo que quedó».
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- runFlow: ../subflows/abrir-movimientos.yaml
- copyTextFrom:
    text: "CICLO .*"
- evalScript: "${output.cycleBefore = maestro.copiedText.split(' · ')[0]}"
- tapOn:
    text: "Inicio"
- tapOn:
    text: "Registrar"
- tapOn:
    text: "Ingreso"
- extendedWaitUntil:
    visible: "(?-i)REGISTRAR INGRESO"
    timeout: 10000
- assertVisible:
    id: income-mode-new-cycle
- assertVisible:
    id: income-mode-add
    selected: true
- tapOn:
    id: income-mode-new-cycle
- tapOn:
    text: "1"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- assertVisible: "10\\.00"
- scrollUntilVisible:
    element:
      id: income-submit
    direction: DOWN
    timeout: 10000
- tapOn:
    id: income-submit
    enabled: true
- extendedWaitUntil:
    notVisible: "(?-i)REGISTRAR INGRESO"
    timeout: 20000
- runFlow: ../subflows/abrir-movimientos.yaml
- extendedWaitUntil:
    visible: "${output.cycleBefore} · .*"
    timeout: 20000
- tapOn:
    text: "Inicio"
- assertNotVisible: "Saldo que quedó.*"
