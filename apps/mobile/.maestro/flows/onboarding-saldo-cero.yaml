appId: com.quipu.finance
tags:
  - p0
  - onboarding
---
# Notion 3f486a7356a681f9880cdca871f470e8
# Dinero de hoy vacío = S/ 0 (Capi, 9 oct). El diario solo se ve en Inicio.
# Corre el pre-paso antes: cuenta nueva en QUIPU_E2E_FRESH_*.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_FRESH_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_FRESH_PASSWORD}
- extendedWaitUntil:
    visible: "¿Cómo entra tu dinero?"
    timeout: 30000
- assertNotVisible: "DÍA DE PAGO"
- assertNotVisible: "El 1 de cada mes"
- tapOn: "Continuar"
- extendedWaitUntil:
    visible: "¿Cuándo cobras?"
    timeout: 10000
- tapOn: "Continuar"
- extendedWaitUntil:
    visible: "¿Cómo repartes tu ingreso?"
    timeout: 10000
- tapOn:
    id: allocation-reset
- tapOn: "Continuar"
- extendedWaitUntil:
    visible: "¿Qué pagas todos los meses?"
    timeout: 10000
- tapOn:
    id: commitments-skip
- extendedWaitUntil:
    visible: "TU SISTEMA · 05/05"
    timeout: 10000
- assertVisible: "Dinero de hoy"
# Espera arreglo pendiente (Pixi, PR #106): hoy el paso 5 muestra «Puedes gastar hoy» y «—».
# «Anota el dinero que tienes hoy…» queda por confirmar con Pixi: no se afirma.
- assertNotVisible: "Puedes gastar hoy"
- assertNotVisible:
    id: confirm-daily
- tapOn: "Empezar mi ciclo"
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 40000
- assertVisible: "S/ 0\\.00"
- assertNotVisible: "Saldo que quedó.*"
- assertVisible: "Necesid\\."
- assertVisible: "Gustos"
- assertVisible: "Ahorro"
