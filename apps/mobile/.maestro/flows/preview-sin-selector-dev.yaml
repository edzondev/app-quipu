appId: com.quipu.finance
tags:
  - smoke
  - p0
  - progreso
---
# Progreso carga sin herramientas de preview de desarrollo.
# Cuenta fija QUIPU_E2E_EMAIL.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- tapOn:
    text: "Progreso"
- extendedWaitUntil:
    visible: "(Aún no cierras un ciclo\\.|CICLOS EN VERDE)"
    timeout: 20000
- assertNotVisible: "Vista de prueba · solo desarrollo"
- assertNotVisible: "Datos reales"
