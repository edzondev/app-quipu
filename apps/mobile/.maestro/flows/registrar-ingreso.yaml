appId: com.quipu.finance
tags:
  - p1
  - registrar
---
# Notion 3f486a7356a6815e9dfcf8f2dd7c1ce4
# Ingreso con ciclo activo. El teléfono lo manda como «Sueldo».
# No se afirman los soles repartidos: dependen del porcentaje y de los días del ciclo.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- tapOn:
    text: "^Registrar$"
- extendedWaitUntil:
    visible: "NUEVO GASTO"
    timeout: 10000
- tapOn:
    text: "^Ingreso$"
- extendedWaitUntil:
    visible: "REGISTRAR INGRESO"
    timeout: 10000
- tapOn:
    text: "^Gasto$"
- assertVisible: "NUEVO GASTO"
- tapOn:
    text: "^Ingreso$"
- extendedWaitUntil:
    visible: "REGISTRAR INGRESO"
    timeout: 10000
- tapOn:
    text: "^1$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- assertVisible: "10\\.00"
- tapOn: "Registrar ingreso"
- extendedWaitUntil:
    notVisible: "REGISTRAR INGRESO"
    timeout: 20000
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: "Sueldo"
    timeout: 15000
- assertVisible: "10\\.00"
