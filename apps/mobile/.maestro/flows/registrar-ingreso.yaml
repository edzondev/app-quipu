appId: com.quipu.finance
tags:
  - p1
  - registrar
---
# Notion 3f486a7356a6815e9dfcf8f2dd7c1ce4
# Ciclo abierto: «Sumar a este ciclo» está y viene marcada (startedToday o no).
# Si el ciclo empezó hoy, nuevo ciclo no está; este flujo no lo afirma: suma S/ 10
# y no cierra. Misma cuenta que el resto.
# income-sheet separa la hoja del botón «Registrar ingreso».
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- tapOn:
    text: "Registrar"
- extendedWaitUntil:
    visible:
      id: expense-sheet
    timeout: 10000
- tapOn:
    text: "Ingreso"
- extendedWaitUntil:
    visible:
      id: income-sheet
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: income-mode-add
    timeout: 10000
- assertVisible:
    id: income-mode-add
    selected: true
- tapOn:
    text: "Gasto"
- assertVisible:
    id: expense-sheet
- tapOn:
    text: "Ingreso"
- extendedWaitUntil:
    visible:
      id: income-sheet
    timeout: 10000
- tapOn:
    id: income-mode-add
- runFlow:
    when:
      visible:
        id: income-extra-types
    commands:
      - scrollUntilVisible:
          element:
            id: income-extra-custom
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: income-extra-custom
- tapOn:
    text: "1"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- assertVisible: "10\\.00"
- scrollUntilVisible:
    element:
      id: income-submit
    direction: DOWN
    timeout: 10000
- tapOn:
    id: income-submit
    enabled: true
- extendedWaitUntil:
    notVisible:
      id: income-sheet
    timeout: 20000
- runFlow: ../subflows/abrir-movimientos.yaml
# Los ingresos se muestran sin decimales si son soles enteros: «+ S/ 10»
# (formatCentsTrimmed en shared/lib/movements/model.ts). «10.00» solo sale en el total del día.
- extendedWaitUntil:
    visible: "\\+ S/ 10"
    timeout: 15000
- assertVisible: "CICLO .*"
