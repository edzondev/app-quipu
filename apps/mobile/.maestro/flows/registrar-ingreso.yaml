appId: com.quipu.finance
tags:
  - p1
  - registrar
---
# Notion 3f486a7356a6815e9dfcf8f2dd7c1ce4
# Ciclo abierto: se ven las dos opciones y «Sumar al ciclo actual» viene marcada.
# Suma S/ 10 y no cierra el ciclo. Misma cuenta que el resto.
# (?-i) separa el título «REGISTRAR INGRESO» del botón «Registrar ingreso».
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- tapOn:
    text: "Registrar"
- extendedWaitUntil:
    visible: "NUEVO GASTO"
    timeout: 10000
- tapOn:
    text: "Ingreso"
- extendedWaitUntil:
    visible: "(?-i)REGISTRAR INGRESO"
    timeout: 10000
- assertVisible:
    id: income-mode-new-cycle
- assertVisible:
    id: income-mode-add
# Ciclo abierto, no vencido: viene marcada «Sumar al ciclo actual».
- assertVisible:
    id: income-mode-add
    selected: true
- tapOn:
    text: "Gasto"
- assertVisible: "NUEVO GASTO"
- tapOn:
    text: "Ingreso"
- extendedWaitUntil:
    visible: "(?-i)REGISTRAR INGRESO"
    timeout: 10000
- tapOn:
    id: income-mode-add
- runFlow:
    when:
      visible:
        id: income-extra-types
    commands:
      - scrollUntilVisible:
          element:
            id: income-extra-custom
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: income-extra-custom
- tapOn:
    text: "1"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- assertVisible: "10\\.00"
- scrollUntilVisible:
    element:
      id: income-submit
    direction: DOWN
    timeout: 10000
- tapOn:
    id: income-submit
    enabled: true
- extendedWaitUntil:
    notVisible: "(?-i)REGISTRAR INGRESO"
    timeout: 20000
- runFlow: ../subflows/abrir-movimientos.yaml
# Los ingresos se muestran sin decimales si son soles enteros: «+ S/ 10»
# (formatCentsTrimmed en shared/lib/movements/model.ts). «10.00» solo sale en el total del día.
- extendedWaitUntil:
    visible: "\\+ S/ 10"
    timeout: 15000
- assertVisible: "CICLO .*"
