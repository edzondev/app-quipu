appId: com.quipu.finance
tags:
  - p1
  - registrar
---
# Notion 3f486a7356a6815e9dfcf8f2dd7c1ce4
# Con un ciclo que empezó antes de hoy se ven las dos opciones.
# «Sumar al ciclo actual» no lo cierra. El rango se compara en sumar-no-cierra.
# No uses la cuenta fija: cada corrida necesita la suya. Una semilla de hoy
# no alcanza (ese día solo se ve «Sumar»). Depende de QUIPU_E2E_PRIOR_CYCLE_*.
# Espera arreglo pendiente (Pixi): en f98b65b la hoja dice «Sueldo» / «Extra». Los textos nuevos esperan feature/mobile-income-cycle-choice.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_PRIOR_CYCLE_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PRIOR_CYCLE_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- tapOn:
    text: "^Registrar$"
- extendedWaitUntil:
    visible: "NUEVO GASTO"
    timeout: 10000
- tapOn:
    text: "^Ingreso$"
- extendedWaitUntil:
    visible: "REGISTRAR INGRESO"
    timeout: 10000
- assertVisible:
    text: "¿Empieza un nuevo ciclo\\?"
    below: "REGISTRAR INGRESO"
- assertVisible:
    text: "Sumar al ciclo actual"
    below: "REGISTRAR INGRESO"
# Cuando llegue feature/mobile-income-cycle-choice. Sin pastEnd, «Sumar» viene marcada.
- assertVisible:
    text: "Sumar al ciclo actual"
    selected: true
- tapOn:
    text: "^Gasto$"
- assertVisible: "NUEVO GASTO"
- tapOn:
    text: "^Ingreso$"
- extendedWaitUntil:
    visible: "REGISTRAR INGRESO"
    timeout: 10000
- tapOn:
    text: "Sumar al ciclo actual"
    below: "REGISTRAR INGRESO"
- tapOn:
    text: "^1$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- assertVisible: "10\\.00"
- tapOn: "Registrar ingreso"
- extendedWaitUntil:
    notVisible: "REGISTRAR INGRESO"
    timeout: 20000
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: ".*10\\.00"
    timeout: 15000
- assertVisible: "CICLO .*"
