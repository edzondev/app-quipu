appId: com.quipu.finance
tags:
  - p1
  - registrar
---
# Notion 3f486a7356a6815e9dfcf8f2dd7c1ce4
# Ingreso extra con ciclo activo: se elige Extra y el ciclo no se cierra.
# El detalle de fechas está en extra-no-cierra.yaml.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- tapOn:
    text: "^Registrar$"
- extendedWaitUntil:
    visible: "NUEVO GASTO"
    timeout: 10000
- tapOn:
    text: "^Ingreso$"
- extendedWaitUntil:
    visible: "REGISTRAR INGRESO"
    timeout: 10000
- assertVisible:
    text: "^Sueldo$"
    below: "REGISTRAR INGRESO"
- assertVisible:
    text: "^Extra$"
    below: "REGISTRAR INGRESO"
- tapOn:
    text: "^Gasto$"
- assertVisible: "NUEVO GASTO"
- tapOn:
    text: "^Ingreso$"
- extendedWaitUntil:
    visible: "REGISTRAR INGRESO"
    timeout: 10000
- tapOn:
    text: "^Extra$"
    below: "REGISTRAR INGRESO"
- tapOn:
    text: "^1$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- tapOn:
    text: "^0$"
- assertVisible: "10\\.00"
- tapOn: "Registrar ingreso"
- extendedWaitUntil:
    notVisible: "REGISTRAR INGRESO"
    timeout: 20000
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: ".*10\\.00"
    timeout: 15000
- assertVisible: "CICLO .*"
