appId: com.quipu.finance
tags:
  - smoke
  - p1
  - auth
---
# Notion 3f486a7356a681698c8ccd745398cce5
# Bienvenida sin sesión: una sola pantalla
# Mismo arranque que subflows/abrir-formulario-correo.yaml (PR #114): clearState
# dentro de launchApp choca con el cierre de la tarea vieja en el emulador.
# Cierra, borra, espera 3 s y recién abre. Si no carga, reintenta.
- retry:
    maxRetries: 2
    commands:
      - stopApp: com.quipu.finance
      - clearState: com.quipu.finance
      - extendedWaitUntil:
          visible: "texto-que-nunca-aparece"
          timeout: 3000
          optional: true
      - launchApp:
          appId: com.quipu.finance
          stopApp: false
      - extendedWaitUntil:
          visible: "Ya tengo cuenta"
          timeout: 45000
- assertVisible: "QUIPU"
- assertVisible: "Divide tu dinero antes de gastarlo"
- assertVisible: "EJEMPLO · PUEDES GASTAR HOY"
- assertVisible: "S/ 42\\.30"
- assertVisible: "Es un ejemplo. Tu número sale del dinero que tienes hoy."
- assertVisible:
    text: "Crear cuenta"
- tapOn:
    text: "Crear cuenta"
- extendedWaitUntil:
    visible: "Crea tu cuenta."
    timeout: 10000
- assertVisible: "CREAR CUENTA · 01/03"
- tapOn: "Volver"
- extendedWaitUntil:
    visible: "S/ 42\\.30"
    timeout: 10000
- assertVisible: "Ya tengo cuenta"
- tapOn: "Ya tengo cuenta"
- extendedWaitUntil:
    visible: "Entrar con correo"
    timeout: 10000
- assertVisible: "Divide tu dinero antes de gastarlo."
- assertVisible: "Continuar con Passkey"
