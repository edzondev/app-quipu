appId: com.quipu.finance
tags:
  - p0
  - registrar
---
# Notion 3f486a7356a681b0b79ffe78ff0896aa
# Un Sueldo varios días antes del fin cierra el ciclo. No hay ventana de 2 días.
# La cuenta QUIPU_E2E_EMAIL tiene que tener un ciclo activo con varios días
# por delante (más de 2). Cobro mañana no sirve: en d7bcb41 eso ya cierra.
# Bloqueado hasta la semilla de ciclo activo de Nato. No uses una cuenta personal.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: "CICLO .*"
    timeout: 15000
- copyTextFrom:
    text: "CICLO .*"
- evalScript: "${output.cycleBefore = maestro.copiedText.split(' · ')[0]}"
- tapOn:
    text: "^Inicio$"
- runFlow:
    file: ../subflows/registrar-ingreso-tipo.yaml
    env:
      QUIPU_TIPO: Sueldo
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: ".*10\\.00"
    timeout: 20000
- assertNotVisible: "${output.cycleBefore} · .*"
- assertVisible: "CICLO .*"
- tapOn:
    text: "^Inicio$"
- assertVisible: "Hoy puedes gastar"
- assertVisible: "Saldo que quedó.*"
