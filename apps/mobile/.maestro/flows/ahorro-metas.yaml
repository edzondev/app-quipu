appId: com.quipu.finance
tags:
  - p1
  - plan
---
# Notion 3f486a7356a68151890de99f4fa8e495
# Ahorro: crear metas. El nombre de 41 caracteres lo corta maxLength={40}
# antes de llegar al mensaje del servidor: no se puede afirmar ese error.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- evalScript: "${output.goal = 'Viaje' + String(Date.now()).slice(-6)}"
- tapOn:
    text: "^Plan$"
- tapOn: "Ahorro y metas"
- extendedWaitUntil:
    visible: "Fondo de Emergencia"
    timeout: 15000
- assertVisible: "Ahorro"
- runFlow:
    when:
      visible: "Crear mi primera meta"
    commands:
      - tapOn:
          text: "^Crear mi primera meta$"
- runFlow:
    when:
      notVisible: "NUEVA META"
    commands:
      - tapOn:
          text: "\\+ Nueva meta"
- extendedWaitUntil:
    visible: "NUEVA META"
    timeout: 10000
- tapOn: "Crear meta"
- extendedWaitUntil:
    visible: "El nombre de la meta es obligatorio."
    timeout: 5000
- tapOn: "Nombre de la meta"
- inputText: ${output.goal}
- tapOn: "Meta"
- inputText: "0"
- hideKeyboard
- tapOn: "Crear meta"
- extendedWaitUntil:
    visible: "La meta debe ser mayor a cero."
    timeout: 5000
- tapOn: "Meta"
- eraseText
- inputText: "2000"
- hideKeyboard
- tapOn: "Crear meta"
- extendedWaitUntil:
    visible: ${output.goal}
    timeout: 20000
- assertVisible: "SIN APORTE AUTOMÁTICO"
- assertVisible: ".*de 2,000"
- runFlow:
    when:
      visible: "Crear mi primera meta"
    commands:
      - tapOn:
          text: "^Crear mi primera meta$"
- runFlow:
    when:
      notVisible: "NUEVA META"
    commands:
      - tapOn:
          text: "\\+ Nueva meta"
- extendedWaitUntil:
    visible: "Nombre de la meta"
    timeout: 10000
- tapOn: "Nombre de la meta"
- inputText: ${output.goal}
- hideKeyboard
- tapOn: "Crear meta"
- extendedWaitUntil:
    visible: "Ya tienes una meta con ese nombre."
    timeout: 20000
- tapOn: "Cancelar"
