appId: com.quipu.finance
tags:
  - p1
  - plan
---
# Notion 3f486a7356a68151890de99f4fa8e495
# Ahorro: crear metas. El nombre de 41 caracteres lo corta maxLength={40}
# antes de llegar al mensaje del servidor: no se puede afirmar ese error.
# Cuenta propia por corrida (QUIPU_E2E_GOALS_*). No hay cómo borrar la meta en la UI.
# La hoja es 60% (goal-sheet.tsx). «Crear meta» se busca con scroll antes de tocarlo.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_GOALS_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_GOALS_PASSWORD}
- extendedWaitUntil:
    visible: "Hoy puedes gastar"
    timeout: 30000
- evalScript: "${output.goal = 'Viaje' + String(Date.now()).slice(-6)}"
- tapOn:
    text: "Plan"
- tapOn: "Ahorro y metas"
- extendedWaitUntil:
    visible: "Fondo de Emergencia"
    timeout: 15000
- assertVisible: "Ahorro"
- runFlow:
    when:
      visible: "Crear mi primera meta"
    commands:
      - tapOn: "Crear mi primera meta"
- runFlow:
    when:
      visible: "\\+ Nueva meta"
    commands:
      - tapOn:
          text: "\\+ Nueva meta"
- extendedWaitUntil:
    visible: "(?-i)NUEVA META"
    timeout: 10000
- scrollUntilVisible:
    element: "Crear meta"
    direction: DOWN
    timeout: 10000
- tapOn: "Crear meta"
- scrollUntilVisible:
    element: "El nombre de la meta es obligatorio."
    direction: UP
    timeout: 10000
- assertVisible: "El nombre de la meta es obligatorio."
- tapOn: "Nombre de la meta"
- inputText: ${output.goal}
- scrollUntilVisible:
    element: "Meta"
    direction: DOWN
    timeout: 10000
- tapOn: "Meta"
- inputText: "0"
- hideKeyboard
- scrollUntilVisible:
    element: "Crear meta"
    direction: DOWN
    timeout: 10000
- tapOn: "Crear meta"
- scrollUntilVisible:
    element: "La meta debe ser mayor a cero."
    direction: UP
    timeout: 10000
- assertVisible: "La meta debe ser mayor a cero."
- tapOn: "Meta"
- eraseText
- inputText: "2000"
- hideKeyboard
- scrollUntilVisible:
    element: "Crear meta"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "Crear meta"
    enabled: true
- extendedWaitUntil:
    visible: ${output.goal}
    timeout: 20000
- assertVisible: "SIN APORTE AUTOMÁTICO"
- assertVisible: ".*de 2,000"
- runFlow:
    when:
      visible: "\\+ Nueva meta"
    commands:
      - tapOn:
          text: "\\+ Nueva meta"
- extendedWaitUntil:
    visible: "Nombre de la meta"
    timeout: 10000
- tapOn: "Nombre de la meta"
- inputText: ${output.goal}
- hideKeyboard
- scrollUntilVisible:
    element: "Crear meta"
    direction: DOWN
    timeout: 10000
- tapOn: "Crear meta"
- extendedWaitUntil:
    visible: "Ya tienes una meta con ese nombre."
    timeout: 20000
- tapOn: "Cancelar"
