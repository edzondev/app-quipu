appId: com.quipu.finance
tags:
  - p0
  - home
  - no-cycle
---
# Notion 3f486a7356a681a4a21fee156fe6858f Inicio sin ciclo (no registra el ingreso)
# Notion 3f486a7356a681daadc6eba893faea43 selector Gasto apagado
# Notion 3f486a7356a681658828cae4cf4edea8 Movimientos vacío
# Notion 3f486a7356a681ac94b3c24b072e1f06 Sobres sin ciclo
# Notion 3f486a7356a681db83dacb9114e2cc0f Ahorro antes del primer ingreso
# Notion 3f486a7356a6811c8f51e4b5febdaa1d Compromisos vacío
# La cuenta no debe tener ciclo ni compromisos. El asistente actual siempre
# llama a startFirstCycle, así que esta cuenta hay que prepararla aparte.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_NO_CYCLE_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_NO_CYCLE_PASSWORD}
- extendedWaitUntil:
    visible: "Aún no hay ciclo"
    timeout: 30000
- assertVisible: "Registra tu primer ingreso para ver cuánto puedes gastar hoy."
- assertVisible: "Registrar ingreso"
- tapOn: "Registrar ingreso"
- extendedWaitUntil:
    visible: "(?-i)REGISTRAR INGRESO"
    timeout: 10000
- tapOn:
    text: "Gasto"
- assertVisible: "(?-i)REGISTRAR INGRESO"
- assertNotVisible: "NUEVO GASTO"
- assertNotVisible: "Abrir detalle del gasto"
- tapOn: "Cancelar"
- tapOn:
    text: "Registrar"
- extendedWaitUntil:
    visible: "(?-i)REGISTRAR INGRESO"
    timeout: 10000
- assertNotVisible: "NUEVO GASTO"
- tapOn: "Cancelar"
- tapOn:
    text: "Movimientos"
- extendedWaitUntil:
    visible: "Todavía no hay nada registrado en este ciclo."
    timeout: 15000
- assertVisible: "Cada gasto que registres aparecerá aquí, ordenado por día y con su sobre."
- assertVisible: "Registrar ingreso"
- assertNotVisible:
    text: "Todos"
- tapOn:
    text: "Plan"
- extendedWaitUntil:
    visible: "Dónde está tu dinero antes de que lo gastes."
    timeout: 10000
- assertNotVisible: "TOTAL REPARTIDO"
- tapOn: "Compromisos"
- extendedWaitUntil:
    visible: "SIN COMPROMISOS"
    timeout: 15000
- assertVisible: "Aún no registras tus pagos fijos."
- tapOn: "Volver"
- tapOn:
    text: "Sobres"
- extendedWaitUntil:
    visible: "Todavía no hay sobres en el ciclo activo."
    timeout: 10000
- tapOn: "Volver"
- tapOn: "Ahorro y metas"
- extendedWaitUntil:
    visible: "Fondo de Emergencia"
    timeout: 15000
- assertVisible: "Tu 20% empieza a acumularse con el primer ingreso."
- assertVisible: "SIN METAS"
- assertVisible: "Tus metas vivirán aquí."
