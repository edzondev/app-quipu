appId: com.quipu.finance
tags:
  - p0
  - home
  - no-cycle
  - cuenta-nueva
---
# Notion 3f486a7356a681a4a21fee156fe6858f Inicio sin ciclo (no registra el ingreso)
# Notion 3f486a7356a681daadc6eba893faea43 selector Gasto apagado
# Notion 3f486a7356a681658828cae4cf4edea8 Movimientos vacío
# Notion 3f486a7356a681ac94b3c24b072e1f06 Sobres sin ciclo
# Notion 3f486a7356a681db83dacb9114e2cc0f Ahorro antes del primer ingreso
# Notion 3f486a7356a6811c8f51e4b5febdaa1d Compromisos vacío
# Perfil sin ningún ciclo. Apunta QUIPU_E2E_EMAIL a esa cuenta. No corre por defecto.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_PASSWORD}
- extendedWaitUntil:
    visible: "Aún no hay ciclo"
    timeout: 30000
- assertVisible: "Registra tu ingreso para ver cuánto puedes gastar hoy."
- assertVisible: "Registrar ingreso"
- tapOn: "Registrar ingreso"
- extendedWaitUntil:
    visible:
      id: income-sheet
    timeout: 10000
- tapOn:
    text: "Gasto"
- assertVisible:
    id: expense-sheet
- assertNotVisible:
    id: income-sheet
- tapOn: "Cancelar"
- tapOn:
    text: "Registrar"
- extendedWaitUntil:
    visible:
      id: income-sheet
    timeout: 10000
- assertNotVisible:
      id: expense-sheet
- tapOn: "Cancelar"
- tapOn:
    text: "Movimientos"
- extendedWaitUntil:
    visible: "Aún no hay movimientos."
    timeout: 15000
- assertVisible: "Tus gastos aparecerán aquí."
- assertVisible: "Registrar ingreso"
- assertNotVisible:
    text: "Todos"
- tapOn:
    text: "Plan"
- extendedWaitUntil:
    visible: "Plan"
    timeout: 10000
- assertNotVisible: "EN TUS SOBRES"
- tapOn: "Compromisos"
- extendedWaitUntil:
    visible: "Aún no registras tus pagos fijos."
    timeout: 15000
- assertVisible: "Aún no registras tus pagos fijos."
- tapOn: "Volver"
- tapOn:
    text: "Sobres"
- extendedWaitUntil:
    visible: "Todavía no hay sobres en el ciclo activo."
    timeout: 10000
- tapOn: "Volver"
- tapOn: "Ahorro"
- extendedWaitUntil:
    visible: "Fondo de Emergencia"
    timeout: 15000
- assertVisible: "Tu 20% empieza a acumularse con el primer ingreso."
- assertVisible: "TUS METAS"
- assertVisible: "Aún no tienes metas."
