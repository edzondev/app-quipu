appId: com.quipu.finance
tags:
  - p0
  - registrar
  - onboarding
---
# Notion 3f486a7356a681b0b79ffe78ff0896aa
# Notion 3f486a7356a6817698dbdf13ffd7bd83
# Un Sueldo cierra el ciclo y arrastra lo que quedó en cada sobre.
# Cobro = mañana cae dentro de la ventana de 2 días de d7bcb41: no prueba esa ventana.
# Un ciclo ya vencido no se fabrica aquí: el seed no crea pastEnd.
# Corre el pre-paso antes: cuenta nueva en QUIPU_E2E_FRESH_*.
- runFlow:
    file: ../subflows/entrar.yaml
    env:
      QUIPU_EMAIL: ${QUIPU_E2E_FRESH_EMAIL}
      QUIPU_PASSWORD: ${QUIPU_E2E_FRESH_PASSWORD}
- extendedWaitUntil:
    visible: "¿Cómo entra tu dinero?"
    timeout: 30000
- runFlow: ../subflows/onboarding-abrir-ciclo.yaml
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: "Todavía no hay nada registrado en este ciclo."
    timeout: 15000
- copyTextFrom:
    text: "CICLO .*"
- evalScript: "${output.cycleBefore = maestro.copiedText.split(' · ')[0]}"
- tapOn:
    text: "^Inicio$"
- runFlow:
    file: ../subflows/registrar-ingreso-tipo.yaml
    env:
      QUIPU_TIPO: Sueldo
- tapOn:
    text: "^Movimientos$"
- extendedWaitUntil:
    visible: ".*10\\.00"
    timeout: 20000
- assertNotVisible: "${output.cycleBefore} · .*"
- assertVisible: "CICLO .*"
- tapOn:
    text: "^Inicio$"
- assertVisible: "Hoy puedes gastar"
- assertVisible: "Saldo que quedó.*"
