plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.quipunotificationlistener'
version = '0.1.0'

android {
  namespace "expo.modules.quipunotificationlistener"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles "consumer-rules.pro"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // JVM tests only. Not packaged into the app.
  testImplementation "junit:junit:4.13.2"
}
